[package]
name = "snapshots"
version = "0.0.0"
description = "Checks the Rust planner against the C# planner's committed Verify snapshots (#138)"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# normalize-lists reads a line's own compressed data strictly, beside blueprint's reader.
base64 = "0.22"
blueprint = { path = "../blueprint" }
flate2 = "1"
planner = { path = "../planner" }
