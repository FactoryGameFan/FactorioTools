name: Continuous integration

on:
  # Do not filter these on "*". In Actions filter patterns a single star does not
  # match "/", so "*" silently excludes every branch with a slash in its name
  # (chore/..., feat/..., etc). On pull_request the filter matches the PR's *base*
  # branch, so stacked PRs got no checks at all. See issue #36.
  push:
    # Push CI is intentionally limited to main; branches get their coverage from
    # pull_request below. This avoids running the full matrix twice per push on
    # any branch that already has a PR open.
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PATH: "./src/vue"

jobs:
  build-vue:
    name: Build front-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Restore dependencies
        run: npm install
        working-directory: ${{ env.BUILD_PATH }}

      # The site loads the Rust planner (rust/planner-wasm). build-wasm builds it for
      # wasm32 and copies planner.js and planner_wasm.wasm into src/lib/planner-wasm,
      # which the Vite build imports, so it has to run first. No toolchain action:
      # rust/rust-toolchain.toml pins the compiler and the wasm32 target, and the
      # runner's rustup installs both on first use, as in the Rust job.
      - name: Build the Rust planner
        run: npm run build-wasm
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Test
        run: npm run test
        working-directory: ${{ env.BUILD_PATH }}

  rust:
    name: Rust port
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No toolchain action: rust/rust-toolchain.toml is honoured by the runner's
      # preinstalled rustup, so the pin stays the single source of truth. Same
      # pattern as factorio-oracle.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The port ships to the browser as WASM, so every crate has to build there.
      - name: Build for wasm32
        run: cargo build --workspace --target wasm32-unknown-unknown

      # The end-to-end gate: the Rust planner must reproduce every committed
      # snapshot under testdata/oil-field (2,747 planner files) and the Score
      # scoreboard byte for byte. The contract replay (rust/contract) runs here too:
      # the JSON the site sends and gets back, against the recorded responses. Both
      # sets are frozen inputs, recorded from the C# planner at commit 0532d923
      # before it was removed. In release this takes about a minute; both are
      # #[ignore]d in debug because they are slow there.
      - name: Check every planner snapshot (release)
        run: cargo test --release -p snapshots -p contract -- --include-ignored

      # The site will load the planner as WebAssembly, so check that build gives the
      # same bytes as the native contract on every recorded request. node-replay.mjs
      # exits 1 on the first difference.
      - name: Check the WebAssembly build matches the native contract
        run: |
          cargo build --release -p planner-wasm --target wasm32-unknown-unknown
          cargo run --release -p contract --example replay -- contract/fixtures/contract.jsonl "$RUNNER_TEMP/native.jsonl"
          node planner-wasm/tests/node-replay.mjs contract/fixtures/contract.jsonl "$RUNNER_TEMP/native.jsonl" target/wasm32-unknown-unknown/release/planner_wasm.wasm

      # Keeps the benchmark runnable: three small-list fields, one run each. Its
      # times are not checked; shared runners are too noisy for that.
      - name: Smoke-test the benchmark
        run: cargo run --release -p bench -- --runs 1 --limit 3
