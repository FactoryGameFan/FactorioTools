name: Deploy to Cloudflare Workers

on:
  # Do not filter branches on "*". In Actions filter patterns a single star does
  # not match "/", so "*" silently excludes every slash-named branch. See ci.yml
  # and issue #36.
  push:
    branches:
      - "main"
  # Pull requests run this whole job except the deploy step itself, so the
  # planner build and the bundle check are proven before merge rather than by the
  # deploy that happens after it.
  #
  # The paths list is what feeds the bundle: the Rust planner (rust/, built by
  # build-wasm into src/vue/src/lib/planner-wasm) and the Vue app. Keep it in
  # sync when something new joins that chain; a missing entry costs coverage
  # silently, which is the failure mode this job exists to remove.
  pull_request:
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "rust/**"
      - "src/vue/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PATH: "./src/vue"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      # Node is set up before the planner build because build-wasm runs through
      # npm and needs shx from node_modules.
      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.BUILD_PATH }}
      # Builds the Rust planner (rust/planner-wasm) for wasm32 and copies planner.js
      # and planner_wasm.wasm into src/lib/planner-wasm for Vite to bundle. No
      # toolchain action: rust/rust-toolchain.toml pins the compiler and the wasm32
      # target, and the runner's rustup installs both on first use. This calls the
      # npm script rather than reimplementing it inline, so the command developers
      # run locally (per CLAUDE.md) and the one that builds the deployed site stay
      # one definition, and this job is what proves it still works.
      - name: Build the Rust planner
        run: npm run build-wasm
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}
      # Guard against shipping a site that cannot plan: the planner's .wasm and its
      # worker must be in dist/assets with a content hash. The second half checks
      # nothing still ships or points at the old .NET bundle under /framework/. That
      # bundle and its src/vue/public/framework/ ignore rule are gone, so a stale
      # local copy left in public/ would now show up as a file to commit.
      - name: Check the planner landed in the bundle
        run: |
          dist="$BUILD_PATH/dist"
          for pattern in 'assets/planner_wasm-*.wasm' 'assets/plannerWorker-*.js'; do
            if ! compgen -G "$dist/$pattern" > /dev/null; then
              echo "::error::$dist/$pattern is missing - did build-wasm run before the Vite build?"
              ls -la "$dist/assets"
              exit 1
            fi
          done
          if [ -e "$dist/framework" ] || grep -rq "framework/dotnet" "$dist"; then
            echo "::error::$dist still has or references the .NET bundle under /framework/."
            exit 1
          fi
          echo "dist/assets has the planner's .wasm and worker, and nothing references /framework/."
      - name: Deploy to Cloudflare Workers
        # Pull requests build and verify, but never deploy. This also keeps the
        # repository's only credential-bearing step off the PR path.
        #
        # `wrangler deploy` reads src/vue/wrangler.jsonc, which names the Worker
        # (assets only, no script), the asset directory (dist) and the
        # oilfieldplanner.factorygamefan.com Custom Domain. Running from
        # BUILD_PATH lets it find that file with no --config flag, and makes the
        # action use the wrangler that `npm install` put in node_modules (pinned
        # by package-lock.json) rather than installing its own.
        #
        # The API token needs Workers permissions, not just Pages ones: at least
        # Account > Workers Scripts: Edit, plus zone access to factorygamefan.com
        # (Zone: Read, Workers Routes: Edit) for the Custom Domain. Cloudflare's
        # "Edit Cloudflare Workers" token template covers all of it. A token made
        # for the old `pages deploy` step may only have Cloudflare Pages: Edit.
        # Make it an account-owned token (Manage Account > Account API Tokens),
        # limited to this account and the factorygamefan.com zone: Cloudflare's
        # CI guide recommends both, and a user token dies with its user.
        if: github.event_name != 'pull_request'
        # v4.1.3. The SHA here before was v4.0.0 under a "# v4" comment; 4.1.0
        # is the release that shows wrangler's own error when a deploy fails.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.BUILD_PATH }}
          command: deploy
