[package]
name = "blueprint"
version = "0.0.0"
description = "Factorio blueprint strings for the oil-field planner port (#138): FactorioTools.Serialization"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
flate2 = "1"
planner = { path = "../planner" }
serde = { version = "1", features = ["derive"] }
# raw_value: positions are read from their JSON text straight to f32, as .NET's float
# parser does, rather than through f64, which could round twice.
serde_json = { version = "1", features = ["raw_value"] }
