# The oil-field planner, ported from C# to Rust (#138). It is the only planner now: the
# site runs its WASM build, and stage 13b removed the C#.
[workspace]
resolver = "3"
members = ["dotnet-compat", "planner", "delaunator-net", "flute", "blueprint", "snapshots", "contract", "planner-wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/FactoryGameFan/FactorioTools"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# The browser module ships without its function-name section (about 80 KB raw).
[profile.release.package.planner-wasm]
strip = true
