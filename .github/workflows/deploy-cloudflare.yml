name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PATH: "./src/vue"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore wasm-tools workload
        run: dotnet workload restore
      - name: Publish BrowserWasm
        run: dotnet publish src/BrowserWasm/BrowserWasm.csproj -c Release
      - name: Copy WASM assets into Vue public
        run: |
          # public/ is gitignored and absent in a fresh checkout; create it so
          # cp targets public/framework instead of flattening the bundle into public/.
          mkdir -p "$BUILD_PATH/public"
          rm -rf "$BUILD_PATH/public/framework"
          cp -r src/BrowserWasm/bin/Release/net10.0/browser-wasm/AppBundle/_framework \
                "$BUILD_PATH/public/framework"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.BUILD_PATH }}
      - name: Build
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.BUILD_PATH }}/dist --project-name=factoriotools
