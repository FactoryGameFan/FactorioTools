name: Continuous integration

on:
  # Do not filter these on "*". In Actions filter patterns a single star does not
  # match "/", so "*" silently excludes every branch with a slash in its name
  # (chore/..., feat/..., etc). On pull_request the filter matches the PR's *base*
  # branch, so stacked PRs got no checks at all. See issue #36.
  push:
    # Push CI is intentionally limited to main; branches get their coverage from
    # pull_request below. This avoids running the full matrix twice per push on
    # any branch that already has a PR open.
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PATH: "./src/vue"

jobs:
  build-vue:
    name: Build front-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Restore dependencies
        run: npm install
        working-directory: ${{ env.BUILD_PATH }}

      # The site loads the Rust planner (rust/planner-wasm). build-wasm builds it for
      # wasm32 and copies planner.js and planner_wasm.wasm into src/lib/planner-wasm,
      # which the Vite build imports, so it has to run first. No toolchain action:
      # rust/rust-toolchain.toml pins the compiler and the wasm32 target, and the
      # runner's rustup installs both on first use, as in the Rust job.
      - name: Build the Rust planner
        run: npm run build-wasm
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Test
        run: npm run test
        working-directory: ${{ env.BUILD_PATH }}

  # Transpiles the core library with CSharp.lua, the way src/lua is actually
  # produced. This is the job that catches a C# construct Lua cannot take -
  # test-lua-settings below only flips MSBuild #if flags and never runs the
  # transpiler. LINQ is the case worth knowing: CSharp.lua transpiles it
  # happily, but Collections.Linq is not in the CoreSystem load list, so the
  # emitted Lua would call a module that was never shipped and fail at runtime
  # inside Factorio rather than at build time.
  transpile-lua:
    name: Transpile to Lua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # No "dotnet workload restore" here: the script builds only FactorioTools
      # and the two submodule libraries, so the wasm-tools workload is not needed.
      - name: Transpile to Lua
        run: pwsh -File src/lua/Invoke-LuaBuild.ps1

      # src/lua is generated output that happens to be committed, so it can go
      # stale without anything failing - it already had, for the pole wire reach.
      - name: Check the committed Lua is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/lua)" ]; then
            echo "::error::src/lua does not match what the C# transpiles to. Run src/lua/Invoke-LuaBuild.ps1 and commit the result."
            git status --porcelain -- src/lua
            git diff -- src/lua
            exit 1
          fi
          echo "src/lua matches the transpiled output."

      # Factorio runs a modified Lua 5.2, and this package is Lua 5.2.4 - the
      # same version the README's Lua performance log was measured against.
      - name: Install Lua 5.2
        run: sudo apt-get update && sudo apt-get install -y lua5.2

      - name: Syntax-check the generated Lua
        run: find src/lua -name '*.lua' -print0 | xargs -0 -n1 luac5.2 -p

      # The step that catches LINQ, and the reason a syntax check is not enough.
      # LINQ transpiles cleanly and parses cleanly; it emits
      # "local Linq = System.Linq.Enumerable", which is nil because
      # Collections.Linq is not in the CoreSystem load list. That only shows up
      # when the module is loaded, so the check has to actually run the planner:
      #   ./FactorioTools/InitializeContext.lua:3: attempt to index field 'Linq'
      # Takes well under a second, and proves the transpiled planner runs at all
      # rather than merely parsing.
      - name: Run the planner under Lua 5.2
        run: lua5.2 sample.lua
        working-directory: src/lua

  test-lua-settings:
    name: Test .NET with Lua-compatible settings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build debug, with Lua settings
        run: dotnet build --configuration Debug /p:UseLuaSettings=true

      - name: Build release, with Lua settings
        run: dotnet build --configuration Release /p:UseLuaSettings=true

      - name: Test with Lua settings
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check no Verify snapshots drifted
        run: |
          if [ -n "$(git status --porcelain -- '*.verified.*')" ]; then
            echo "::error::A Verify snapshot changed during the test run. The committed snapshot does not match current behavior - regenerate locally and commit, or fix the regression."
            git status --porcelain -- '*.verified.*'
            git diff -- '*.verified.*'
            exit 1
          fi
          echo "No Verify snapshots drifted."

  # The browser bundle ships with LocationAsStruct=false (see build-wasm in
  # src/vue/package.json and issue #139), so that combination must be tested on
  # its own, not only built. UseLuaSettings also turns it off, but changes five
  # other flags with it.
  test-location-as-class:
    name: Test .NET with Location as a class (the shipped WASM setting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build release, Location as a class
        run: dotnet build --configuration Release /p:LocationAsStruct=false

      - name: Test with Location as a class
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check no Verify snapshots drifted
        run: |
          if [ -n "$(git status --porcelain -- '*.verified.*')" ]; then
            echo "::error::A Verify snapshot changed during the test run. The committed snapshot does not match current behavior - regenerate locally and commit, or fix the regression."
            git status --porcelain -- '*.verified.*'
            git diff -- '*.verified.*'
            exit 1
          fi
          echo "No Verify snapshots drifted."

  test-default:
    name: Test .NET with default settings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build debug, no hash sets
        run: dotnet build --configuration Debug /p:UseHashSets=false

      - name: Build debug, no bit array
        run: dotnet build --configuration Debug /p:UseBitArray=false

      - name: Build debug, location as class
        run: dotnet build --configuration Debug /p:LocationAsStruct=false

      - name: Build debug, no shared instances
        run: dotnet build --configuration Debug /p:UseSharedInstances=false

      - name: Build debug, no vectors
        run: dotnet build --configuration Debug /p:UseVectors=false

      - name: Build debug, no stackalloc
        run: dotnet build --configuration Debug /p:UseStackalloc=false

      - name: Build debug, rent neighbors
        run: dotnet build --configuration Debug /p:RentNeighbors=true

      - name: Build debug, allow dynamic FLUTE degree
        run: dotnet build --configuration Debug /p:AllowDynamicFluteDegree=true

      - name: Build debug, no grid ToString
        run: dotnet build --configuration Debug /p:EnableGridToString=false

      - name: Build release with default settings
        run: dotnet build --configuration Release

      # swagger.json is committed generated output: WebApp.csproj's PostBuild
      # target reruns the Swashbuckle CLI on every build, including every build
      # above, so by now CI has already regenerated it several times. Nothing
      # compared it to the committed copy, so a contract change could sit stale
      # indefinitely while CI stayed green. Note the invocation lives in MSBuild,
      # not in this file - grepping the workflows for "swagger" finds nothing,
      # which makes this easy to misdiagnose as "the tool never runs in CI".
      - name: Check the committed swagger.json is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/WebApp/swagger.json)" ]; then
            echo "::error::src/WebApp/swagger.json does not match what the WebApp generates. Run 'dotnet build src/WebApp/WebApp.csproj' and commit the result (then 'npm run swagger-gen' in src/vue to refresh the client)."
            git diff -- src/WebApp/swagger.json
            exit 1
          fi
          echo "src/WebApp/swagger.json matches the generated document."

      - name: Test with default settings
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      # Backstop, not the primary guard. The primary guard works: SetVerifySettings
      # calls AutoVerify(includeBuildServer: false), DiffEngine correctly detects this
      # runner as a build server, and a stale snapshot fails the test above with
      # VerifyException - confirmed by committing a corrupted snapshot and watching
      # CI go red at "Test with Lua settings".
      #
      # This step exists because that guard is only as good as DiffEngine's detection,
      # which is version-dependent and has changed before. If it ever regresses, a
      # rewritten snapshot leaves the file dirty and this catches it. Costs nothing.
      #
      # Worth knowing if you ever debug this: setting CI=1 / GITHUB_ACTIONS=true
      # locally does NOT reproduce the detection, so a local run auto-accepts and
      # looks like the guard is broken. It is not - test it on a real runner.
      - name: Check no Verify snapshots drifted
        run: |
          if [ -n "$(git status --porcelain -- '*.verified.*')" ]; then
            echo "::error::A Verify snapshot changed during the test run. The committed snapshot does not match current behavior - regenerate locally and commit, or fix the regression."
            git status --porcelain -- '*.verified.*'
            git diff -- '*.verified.*'
            exit 1
          fi
          echo "No Verify snapshots drifted."

      # The Rust port (#138) is checked against fixtures recorded from .NET: the
      # BCL's tie-breaking (dotnet-compat), DelaunatorSharp, FluteSharp and the C#
      # planner itself. They are committed so the Rust job needs no .NET. This
      # reruns every recorder on the pinned SDK and fails if any committed fixture
      # changes - an SDK bump that changes .NET's behavior, or a C# planner change
      # that has not been mirrored in the Rust port (see CLAUDE.md, "Rust port").
      - name: Check the Rust port's fixtures still match .NET
        run: |
          for crate in dotnet-compat delaunator-net flute planner contract; do
            dotnet run --project "rust/$crate/oracle" --configuration Release -- "rust/$crate/fixtures"
          done
          if [ -n "$(git status --porcelain -- 'rust/*/fixtures/*')" ]; then
            echo "::error::Recorded fixtures under rust/ no longer match what .NET produces. Rerun the recorder named in that crate's FIXTURES.md, commit the result, and make the Rust tests pass against it."
            git status --porcelain -- 'rust/*/fixtures/*'
            exit 1
          fi
          echo "All Rust port fixtures match .NET."

      - name: Publish
        run: dotnet publish src/WebApp --configuration Release --output src/WebApp/bin/publish --runtime linux-x64 --no-self-contained /p:PublishReadyToRun=true

  rust:
    name: Rust port
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No toolchain action: rust/rust-toolchain.toml is honoured by the runner's
      # preinstalled rustup, so the pin stays the single source of truth. Same
      # pattern as factorio-oracle.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # The port ships to the browser as WASM, so every crate has to build there.
      - name: Build for wasm32
        run: cargo build --workspace --target wasm32-unknown-unknown

      # The port's end-to-end gate: the Rust planner must reproduce every committed
      # Verify snapshot (2,747 planner files) and the Score scoreboard byte for byte,
      # with no .NET involved. The contract replay (rust/contract) runs here too: the
      # JSON the site sends and gets back, against responses recorded from the C#.
      # In release this takes about a minute; both are #[ignore]d in debug because
      # they are slow there.
      - name: Check every planner snapshot (release)
        run: cargo test --release -p snapshots -p contract -- --include-ignored

      # The site will load the planner as WebAssembly, so check that build gives the
      # same bytes as the native contract on every recorded request. node-replay.mjs
      # exits 1 on the first difference.
      - name: Check the WebAssembly build matches the native contract
        run: |
          cargo build --release -p planner-wasm --target wasm32-unknown-unknown
          cargo run --release -p contract --example replay -- contract/fixtures/contract.jsonl "$RUNNER_TEMP/native.jsonl"
          node planner-wasm/tests/node-replay.mjs contract/fixtures/contract.jsonl "$RUNNER_TEMP/native.jsonl" target/wasm32-unknown-unknown/release/planner_wasm.wasm
