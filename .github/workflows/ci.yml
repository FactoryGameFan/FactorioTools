name: Continuous integration

on:
  # Do not filter these on "*". In Actions filter patterns a single star does not
  # match "/", so "*" silently excludes every branch with a slash in its name
  # (chore/..., feat/..., etc). On pull_request the filter matches the PR's *base*
  # branch, so stacked PRs got no checks at all. See issue #36.
  push:
    # Push CI is intentionally limited to main; branches get their coverage from
    # pull_request below. This avoids running the full matrix twice per push on
    # any branch that already has a PR open.
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_PATH: "./src/vue"

jobs:
  build-vue:
    name: Build front-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Restore dependencies
        run: npm install
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

      # "npm run build" runs swagger-gen first, so the build above has already
      # regenerated the committed TS client from the committed swagger.json.
      # This is the second link in the chain the swagger.json check below guards:
      # WebApp C# -> swagger.json -> src/vue/src/lib -> the deployed front-end.
      # Without this, the client could keep describing an older contract than the
      # swagger.json sitting next to it. Only FactorioToolsApi.ts is generated -
      # everything else in src/lib is hand-written.
      - name: Check the committed API client is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/vue/src/lib/FactorioToolsApi.ts)" ]; then
            echo "::error::src/vue/src/lib/FactorioToolsApi.ts does not match what swagger.json generates. Run 'npm run swagger-gen' in src/vue and commit the result."
            git diff -- src/vue/src/lib/FactorioToolsApi.ts
            exit 1
          fi
          echo "src/vue/src/lib/FactorioToolsApi.ts matches the generated client."

      - name: Test
        run: npm run test
        working-directory: ${{ env.BUILD_PATH }}

  # Transpiles the core library with CSharp.lua, the way src/lua is actually
  # produced. This is the job that catches a C# construct Lua cannot take -
  # test-lua-settings below only flips MSBuild #if flags and never runs the
  # transpiler. LINQ is the case worth knowing: CSharp.lua transpiles it
  # happily, but Collections.Linq is not in the CoreSystem load list, so the
  # emitted Lua would call a module that was never shipped and fail at runtime
  # inside Factorio rather than at build time.
  transpile-lua:
    name: Transpile to Lua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # No "dotnet workload restore" here: the script builds only FactorioTools
      # and the two submodule libraries, so the wasm-tools workload is not needed.
      - name: Transpile to Lua
        run: pwsh -File src/lua/Invoke-LuaBuild.ps1

      # src/lua is generated output that happens to be committed, so it can go
      # stale without anything failing - it already had, for the pole wire reach.
      - name: Check the committed Lua is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/lua)" ]; then
            echo "::error::src/lua does not match what the C# transpiles to. Run src/lua/Invoke-LuaBuild.ps1 and commit the result."
            git status --porcelain -- src/lua
            git diff -- src/lua
            exit 1
          fi
          echo "src/lua matches the transpiled output."

      # Factorio runs a modified Lua 5.2, and this package is Lua 5.2.4 - the
      # same version the README's Lua performance log was measured against.
      - name: Install Lua 5.2
        run: sudo apt-get update && sudo apt-get install -y lua5.2

      - name: Syntax-check the generated Lua
        run: find src/lua -name '*.lua' -print0 | xargs -0 -n1 luac5.2 -p

      # The step that catches LINQ, and the reason a syntax check is not enough.
      # LINQ transpiles cleanly and parses cleanly; it emits
      # "local Linq = System.Linq.Enumerable", which is nil because
      # Collections.Linq is not in the CoreSystem load list. That only shows up
      # when the module is loaded, so the check has to actually run the planner:
      #   ./FactorioTools/InitializeContext.lua:3: attempt to index field 'Linq'
      # Takes well under a second, and proves the transpiled planner runs at all
      # rather than merely parsing.
      - name: Run the planner under Lua 5.2
        run: lua5.2 sample.lua
        working-directory: src/lua

  test-lua-settings:
    name: Test .NET with Lua-compatible settings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build debug, with Lua settings
        run: dotnet build --configuration Debug /p:UseLuaSettings=true

      - name: Build release, with Lua settings
        run: dotnet build --configuration Release /p:UseLuaSettings=true

      - name: Test with Lua settings
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  test-default:
    name: Test .NET with default settings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore workloads
        run: dotnet workload restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build debug, no hash sets
        run: dotnet build --configuration Debug /p:UseHashSets=false

      - name: Build debug, no bit array
        run: dotnet build --configuration Debug /p:UseBitArray=false

      - name: Build debug, location as class
        run: dotnet build --configuration Debug /p:LocationAsStruct=false

      - name: Build debug, no shared instances
        run: dotnet build --configuration Debug /p:UseSharedInstances=false

      - name: Build debug, no vectors
        run: dotnet build --configuration Debug /p:UseVectors=false

      - name: Build debug, no stackalloc
        run: dotnet build --configuration Debug /p:UseStackalloc=false

      - name: Build debug, rent neighbors
        run: dotnet build --configuration Debug /p:RentNeighbors=true

      - name: Build debug, allow dynamic FLUTE degree
        run: dotnet build --configuration Debug /p:AllowDynamicFluteDegree=true

      - name: Build debug, no grid ToString
        run: dotnet build --configuration Debug /p:EnableGridToString=false

      - name: Build release with default settings
        run: dotnet build --configuration Release

      # swagger.json is committed generated output: WebApp.csproj's PostBuild
      # target reruns the Swashbuckle CLI on every build, including every build
      # above, so by now CI has already regenerated it several times. Nothing
      # compared it to the committed copy, so a contract change could sit stale
      # indefinitely while CI stayed green. Note the invocation lives in MSBuild,
      # not in this file - grepping the workflows for "swagger" finds nothing,
      # which makes this easy to misdiagnose as "the tool never runs in CI".
      - name: Check the committed swagger.json is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/WebApp/swagger.json)" ]; then
            echo "::error::src/WebApp/swagger.json does not match what the WebApp generates. Run 'dotnet build src/WebApp/WebApp.csproj' and commit the result (then 'npm run swagger-gen' in src/vue to refresh the client)."
            git diff -- src/WebApp/swagger.json
            exit 1
          fi
          echo "src/WebApp/swagger.json matches the generated document."

      - name: Test with default settings
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Publish
        run: dotnet publish src/WebApp --configuration Release --output src/WebApp/bin/publish --runtime linux-x64 --no-self-contained /p:PublishReadyToRun=true
